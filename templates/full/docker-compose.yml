version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: my_app_db
      POSTGRES_USER: my_app_user
      POSTGRES_PASSWORD: my_app_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U my_app_user -d my_app_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: ./apps/api/Dockerfile
    environment:
      NODE_ENV: development
      PORT: 4202
      DATABASE_URL: postgresql://my_app_user:my_app_password@postgres:5432/my_app_db
      REDIS_URL: redis://redis:6379
      JWT_SECRET: change_in_production
      CORS_ORIGIN: http://localhost:4200,http://localhost:4201
    ports:
      - "4202:4202"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  dashboard:
    build:
      context: .
      dockerfile: ./apps/dashboard/Dockerfile
    ports:
      - "4200:8080"
    depends_on:
      - api
    restart: unless-stopped

  website:
    build:
      context: .
      dockerfile: ./apps/website/Dockerfile
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: http://api:4202
    ports:
      - "4201:3000"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:

networks:
  default:
    name: my_app_network
